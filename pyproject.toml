[project]
name = "travel-ai"
version = "0.1.0"
description = "AI Travel Agent Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "requests>=2.31.0",
    "groq>=0.30.0",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "sse-starlette>=2.0.0",
    "fastmcp>=3.2",
    "curl-cffi>=0.7.0",
    "ratelimit>=2.2.1",
    "babel>=2.14.0",
    "plotext>=5.3.0",
    "typer>=0.12.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-s"
